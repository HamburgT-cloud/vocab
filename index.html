<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>単語トレーナー</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
/* Layout: one column app. Home, quiz, result and box are rendered into #app one at a time. */
:root {
  --bg: #eef1f5;
  --surface: #ffffff;
  --fg: #1a2230;
  --muted: #5d6877;
  --line: #d6dce5;
  --accent: #2f5fd0;
  --accent-fg: #ffffff;
  --accent-soft: #e3ebfb;
  --box: #a8661a;
  --box-soft: #f8ead7;
  --good: #1f7a4d;
  --good-soft: #dcf2e5;
  --bad: #b3332b;
  --bad-soft: #f9e2df;
  --font-body: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic UI", "Noto Sans JP", "Meiryo", system-ui, sans-serif;
  --font-word: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11161e; --surface: #1a212c; --fg: #e5eaf1; --muted: #98a4b4; --line: #2b3544;
    --accent: #7ba1ff; --accent-fg: #0b1220; --accent-soft: #223356;
    --box: #e0a45c; --box-soft: #3a2c19;
    --good: #5fcf94; --good-soft: #17382a; --bad: #ff8a80; --bad-soft: #43221f;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11161e; --surface: #1a212c; --fg: #e5eaf1; --muted: #98a4b4; --line: #2b3544;
  --accent: #7ba1ff; --accent-fg: #0b1220; --accent-soft: #223356;
  --box: #e0a45c; --box-soft: #3a2c19;
  --good: #5fcf94; --good-soft: #17382a; --bad: #ff8a80; --bad-soft: #43221f;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.6;
  padding-block: max(20px, env(safe-area-inset-top, 0px)) max(48px, env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
#app { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
h1, h2, h3, p { margin: 0; }
h1 { font-size: 24px; line-height: 1.3; }
.sub { color: var(--muted); font-size: 13px; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 13px 16px; min-height: 48px; font-weight: 700; text-align: center; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.btn.boxy { border-color: var(--box); color: var(--box); }
.btn.small { min-height: 38px; padding: 7px 12px; font-size: 13px; border-radius: 8px; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.link { background: none; border: 0; color: var(--accent); padding: 6px 0; font-weight: 700; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.row > .btn { flex: 1 1 150px; }
.stats { display: flex; gap: 20px; flex-wrap: wrap; }
.stats div { display: flex; flex-direction: column; }
.stats b { font-family: var(--font-word); font-size: 22px; font-variant-numeric: tabular-nums; }
.stats span { font-size: 12px; color: var(--muted); }
label.field { display: flex; align-items: center; gap: 10px; font-size: 14px; }
select { font: inherit; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--fg); }
details summary { cursor: pointer; font-weight: 700; padding: 4px 0; }
details > div { display: flex; flex-direction: column; gap: 10px; margin-top: 8px; }
.note { font-size: 12px; color: var(--muted); }
.msg { font-size: 13px; padding: 8px 10px; border-radius: 8px; background: var(--accent-soft); }

.qhead { display: flex; align-items: center; gap: 12px; }
.qhead .count { font-family: var(--font-word); font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.track { flex: 1; height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
.fill { height: 100%; background: var(--accent); }
.meta { display: flex; gap: 8px; align-items: center; }
.chip { font-size: 12px; padding: 2px 9px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); font-weight: 700; }
.chip.box { background: var(--box-soft); color: var(--box); }
.chip.bad { background: var(--bad-soft); color: var(--bad); }
.word { font-family: var(--font-word); font-size: 32px; line-height: 1.2; font-weight: 700; overflow-wrap: anywhere; }
.choices { display: grid; gap: 8px; }
.choice { display: flex; gap: 12px; align-items: flex-start; text-align: left; border: 1px solid var(--line); background: var(--bg); border-radius: 10px; padding: 12px; min-height: 52px; width: 100%; }
.choice .k { font-family: var(--font-word); font-size: 12px; min-width: 22px; height: 22px; border-radius: 6px; display: inline-flex; align-items: center; justify-content: center; background: var(--surface); border: 1px solid var(--line); color: var(--muted); margin-top: 1px; }
.choice .t { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.choice.good { border-color: var(--good); background: var(--good-soft); }
.choice.bad { border-color: var(--bad); background: var(--bad-soft); }
.choice[disabled] { cursor: default; }
.flag { display: flex; gap: 10px; align-items: center; background: none; border: 1px dashed var(--line); border-radius: 10px; padding: 10px 12px; text-align: left; width: 100%; font-size: 14px; }
.flag .cb { width: 22px; height: 22px; border-radius: 6px; border: 2px solid var(--muted); display: inline-flex; align-items: center; justify-content: center; font-weight: 700; color: transparent; flex: none; }
.flag[aria-checked="true"] { border: 1px solid var(--box); background: var(--box-soft); }
.flag[aria-checked="true"] .cb { background: var(--box); border-color: var(--box); color: #fff; }
.feedback { display: flex; flex-direction: column; gap: 10px; }
.verdict { padding: 10px 12px; border-radius: 10px; font-weight: 700; }
.verdict.ok { background: var(--good-soft); color: var(--good); }
.verdict.ng { background: var(--bad-soft); color: var(--bad); }
.verdict span { display: block; font-weight: 400; color: var(--fg); margin-top: 2px; }

.score b { font-family: var(--font-word); font-size: 40px; font-variant-numeric: tabular-nums; }
.list { display: flex; flex-direction: column; }
.item { display: grid; grid-template-columns: auto 1fr auto; gap: 4px 12px; padding: 10px 0; border-top: 1px solid var(--line); align-items: start; }
.item:first-child { border-top: 0; }
.item .mark { font-weight: 700; width: 20px; text-align: center; }
.item .mark.ok { color: var(--good); }
.item .mark.ng { color: var(--bad); }
.item .w { font-family: var(--font-word); font-weight: 700; overflow-wrap: anywhere; }
.item .m { color: var(--muted); font-size: 13px; grid-column: 2; }
.item .chips { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.empty { color: var(--muted); padding: 12px 0; }
@media (prefers-reduced-motion: no-preference) { .fill { transition: width .2s; } }
</style>
</head>

  function weight(x) {
    var s = state.stats[x.w];
    if (!s) return 3;
    return s.w > s.c ? 2 : 1;
  }
  function pickWords(mode, n) {
    if (mode === "box") {
      var bw = boxWords().map(function (w) { return wordMap[w]; });
      return shuffle(bw).slice(0, n);
    }
    return weightedSample(words, weight, n);
  }

  /* ---------- csv ---------- */
  function csvEscape(s) { s = String(s); return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }
  function toCsv(rows) { return rows.map(function (r) { return r.map(csvEscape).join(","); }).join("\r\n") + "\r\n"; }
  function parseCsv(text) {
    if (text.charCodeAt(0) === 0xfeff) text = text.slice(1);
    var rows = [], row = [], cur = "", q = false;
    for (var i = 0; i < text.length; i++) {
      var c = text[i];
      if (q) {
        if (c === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else q = false; }
        else cur += c;
      } else if (c === '"') q = true;
      else if (c === ",") { row.push(cur); cur = ""; }
      else if (c === "\n" || c === "\r") {
        if (c === "\r" && text[i + 1] === "\n") i++;
        row.push(cur); cur = "";
        if (row.length > 1 || row[0] !== "") rows.push(row);
        row = [];
      } else cur += c;
    }
    if (cur !== "" || row.length) { row.push(cur); rows.push(row); }
    return rows;
  }
  function rowsFromCsv(text) {
    var rows = parseCsv(text), out = [];
    rows.forEach(function (r, i) {
      r = r.map(function (x) { return x.trim(); });
      if (i === 0 && /^word$/i.test(r[0])) return;
      if (!r[0]) return;
      var p = "", m = "";
      if (r.length >= 3) { p = POS_FROM_JP[r[1]] || r[1].toLowerCase(); m = r[2]; }
      else { m = r[1] || ""; }
      if (!/^(n|v|adj|adv)$/.test(p)) p = "";
      if (m) out.push([r[0], p, m]);
    });
    return out;
  }

  var api = { tokens: tokens, shuffle: shuffle, weightedSample: weightedSample, toWords: toWords, makeQuestion: makeQuestion, parseCsv: parseCsv, rowsFromCsv: rowsFromCsv, toCsv: toCsv, words: words };
  if (typeof document === "undefined") { (typeof globalThis !== "undefined" ? globalThis : this).__VT = api; return; }
  window.__VT = api;

  /* ---------- ui ---------- */
  var app = document.getElementById("app");
  var quiz = null;     // {mode, qs, i, done}
  var message = "";
  var confirmReset = false;
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function posLabel(p) { return POS_LABEL[p] || POS_LABEL[""]; }
  function pct(a, b) { return b ? Math.round(a / b * 100) : 0; }

  function renderHome() {
    quiz = null;
    var seen = Object.keys(state.stats).length, boxN = boxWords().length;
    var c = 0, w = 0;
    Object.keys(state.stats).forEach(function (k) { c += state.stats[k].c; w += state.stats[k].w; });
    var nOpts = [10, 20, 30, 50].map(function (n) {
      return '<option value="' + n + '"' + (state.settings.n === n ? " selected" : "") + ">" + n + "問</option>";
    }).join("");
    app.innerHTML =
      '<header><h1>単語トレーナー</h1><p class="sub">' + words.length + '語から無作為に出題します。間違えた問題とチェックした問題は「箱」に入ります。</p></header>' +
      (message ? '<p class="msg" role="status">' + esc(message) + "</p>" : "") +
      '<section class="card"><div class="stats">' +
      "<div><b>" + words.length + "</b><span>登録語数</span></div>" +
      "<div><b>" + seen + "</b><span>解いた単語</span></div>" +
      "<div><b>" + (c + w ? pct(c, c + w) + "%" : "-") + "</b><span>累計の正答率</span></div>" +
      "<div><b>" + boxN + "</b><span>箱の中</span></div></div>" +
      '<label class="field">出題数 <select id="nsel">' + nOpts + "</select></label>" +
      '<div class="row"><button class="btn primary" data-act="start-all">全単語から出題</button>' +
      '<button class="btn boxy" data-act="start-box"' + (boxN ? "" : " disabled") + ">箱から出題（" + boxN + "）</button></div>" +
      '<button class="btn" data-act="open-box">箱の中身を見る</button></section>' +
      '<section class="card"><details><summary>データの管理（Excel / CSV）</summary><div>' +
      '<p class="note">単語一覧はCSV（word, pos, meaning）で書き出せます。Excelで編集して保存し直し、下で取り込むと自分用の問題集になります。</p>' +
      '<div class="row"><button class="btn small" data-act="exp-all">全単語をCSV保存</button><button class="btn small" data-act="copy-all">全単語をコピー</button></div>' +
      '<label class="field">取り込み方法 <select id="impmode"><option value="merge">追加（同じ単語は上書き）</option><option value="replace">全部置き換える</option></select></label>' +
      '<input type="file" id="impfile" accept=".csv,.txt,text/csv,text/plain">' +
      '<div class="row"><button class="btn small" data-act="reset-words">初期データに戻す</button>' +
      '<button class="btn small" data-act="reset-stats">' + (confirmReset ? "本当に消す（もう一度押す）" : "学習記録と箱を消す") + "</button></div>" +
      (storageOk ? "" : '<p class="note">この環境では記録を保存できません。ページを閉じると記録は消えます。</p>') +
      "</div></details></section>";
    message = "";
  }

  function startQuiz(mode) {
    var n = state.settings.n;
    var ws = pickWords(mode, n);
    if (!ws.length) { message = "出題できる単語がありません。"; renderHome(); return; }
    quiz = { mode: mode, qs: ws.map(function (x) { return makeQuestion(x, words); }), i: 0, done: false };
    renderQuiz();
  }

  function renderQuiz() {
    var q = quiz.qs[quiz.i], answered = q.picked !== null, N = quiz.qs.length;
    var ch = q.choices.map(function (m, i) {
      var cls = "choice";
      if (answered) { if (i === q.correct) cls += " good"; else if (i === q.picked) cls += " bad"; }
      return '<button class="' + cls + '" data-act="pick" data-i="' + i + '"' + (answered ? " disabled" : "") + '><span class="k">' + (i + 1) + '</span><span class="t">' + esc(m) + "</span></button>";
    }).join("");
    var fb = "";
    if (answered) {
      var ok = q.picked === q.correct;
      fb = '<div class="feedback"><div class="verdict ' + (ok ? "ok" : "ng") + '">' + (ok ? "正解" : "不正解") +
        "<span>" + esc(q.word.w) + " = " + esc(q.word.m) + "</span></div>" +
        '<button class="btn primary" data-act="next">' + (quiz.i === N - 1 ? "結果を見る" : "次へ") + "</button></div>";
    }
    app.innerHTML =
      '<div class="qhead"><button class="link" data-act="quit">中止</button><div class="track"><div class="fill" style="width:' + (quiz.i + (answered ? 1 : 0)) / N * 100 + '%"></div></div><span class="count">' + (quiz.i + 1) + " / " + N + "</span></div>" +
      '<section class="card"><div class="meta"><span class="chip">' + posLabel(q.word.p) + "</span>" + (quiz.mode === "box" ? '<span class="chip box">箱から</span>' : "") + "</div>" +
      '<h2 class="word">' + esc(q.word.w) + "</h2>" +
      '<div class="choices">' + ch + "</div>" +
      '<button class="flag" role="checkbox" aria-checked="' + q.flag + '" data-act="flag"><span class="cb">✓</span><span>自信がない・あとで復習する（箱に入れる）</span></button>' +
      fb + "</section>";
  }

  function pick(i) {
    var q = quiz.qs[quiz.i];
    if (q.picked !== null) return;
    q.picked = i;
    var w = q.word.w, ok = i === q.correct;
    var s = state.stats[w] || { c: 0, w: 0 };
    if (ok) s.c++; else s.w++;
    state.stats[w] = s;
    if (!ok) boxAdd(w, "wrong");
    else if (quiz.mode === "box" && state.settings.removeOnCorrect && !q.flag) { delete state.box[w]; }
    persist();
    renderQuiz();
  }
  function toggleFlag() {
    var q = quiz.qs[quiz.i];
    q.flag = !q.flag;
    if (q.flag) boxAdd(q.word.w, "check"); else boxClear(q.word.w, "check");
    renderQuiz();
  }
  function next() {
    if (quiz.i < quiz.qs.length - 1) { quiz.i++; renderQuiz(); }
    else { quiz.done = true; renderResult(); }
  }

  function renderResult() {
    var N = quiz.qs.length, good = quiz.qs.filter(function (q) { return q.picked === q.correct; }).length;
    var added = quiz.qs.filter(function (q) { return state.box[q.word.w]; }).length;
    var items = quiz.qs.map(function (q) {
      var ok = q.picked === q.correct, b = state.box[q.word.w];
      return '<div class="item"><span class="mark ' + (ok ? "ok" : "ng") + '">' + (ok ? "○" : "×") + '</span><span class="w">' + esc(q.word.w) + "</span>" +
        '<span class="chips">' + (q.flag ? '<span class="chip box">チェック</span>' : "") + (b && b.wrong ? '<span class="chip bad">間違い</span>' : "") + "</span>" +
        '<span class="m">' + esc(q.word.m) + "</span></div>";
    }).join("");
    app.innerHTML =
      '<section class="card score"><span class="sub">結果</span><div><b>' + good + " / " + N + "</b></div><p class=\"sub\">箱に入っている問題：" + added + "問</p></section>" +
      '<div class="row"><button class="btn primary" data-act="again">もう一度（新しい' + N + "問）</button>" +
      '<button class="btn boxy" data-act="open-box">箱を見る</button><button class="btn" data-act="home">ホーム</button></div>' +
      '<section class="card"><div class="list">' + items + "</div></section>";
  }

  function renderBox() {
    var keys = boxWords().sort(function (a, b) { return state.box[b].t - state.box[a].t; });
    var rows = keys.map(function (w) {
      var x = wordMap[w], b = state.box[w];
      return '<div class="item"><span></span><span class="w">' + esc(w) + "</span>" +
        '<span class="chips">' + (b.check ? '<span class="chip box">チェック</span>' : "") + (b.wrong ? '<span class="chip bad">間違い</span>' : "") +
        '<button class="btn small" data-act="out" data-w="' + esc(w) + '">出す</button></span>' +
        '<span class="m">' + esc(posLabel(x.p)) + "　" + esc(x.m) + "</span></div>";
    }).join("");
    app.innerHTML =
      '<div class="qhead"><button class="link" data-act="home">← ホーム</button></div>' +
      "<header><h1>箱（" + keys.length + "語）</h1><p class=\"sub\">間違えた単語と、自分でチェックした単語が入ります。</p></header>" +
      '<div class="row"><button class="btn boxy" data-act="start-box"' + (keys.length ? "" : " disabled") + ">箱から出題</button>" +
      '<button class="btn small" data-act="exp-box"' + (keys.length ? "" : " disabled") + ">CSV保存</button>" +
      '<button class="btn small" data-act="copy-box"' + (keys.length ? "" : " disabled") + ">コピー</button></div>" +
      '<label class="field"><input type="checkbox" id="roc"' + (state.settings.removeOnCorrect ? " checked" : "") + '> 箱からの出題で正解したら、箱から出す</label>' +
      (message ? '<p class="msg" role="status">' + esc(message) + "</p>" : "") +
      '<section class="card">' + (rows ? '<div class="list">' + rows + "</div>" : '<p class="empty">箱は空です。間違えた単語や、チェックを付けた単語がここに入ります。</p>') + "</section>";
    message = "";
  }

  function download(name, text) {
    try {
      var blob = new Blob(["﻿" + text], { type: "text/csv;charset=utf-8" });
      var url = URL.createObjectURL(blob), a = document.createElement("a");
      a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function () { URL.revokeObjectURL(url); }, 1500);
      return true;
    } catch (e) { return false; }
  }
  function copy(text, done) {
    try {
      navigator.clipboard.writeText(text).then(function () { done(true); }, function () { done(false); });
    } catch (e) { done(false); }
  }
  function allRows() { return [["word", "pos", "meaning"]].concat(words.map(function (x) { return [x.w, x.p, x.m]; })); }
  function boxRows() {
    return [["word", "pos", "meaning", "reason"]].concat(boxWords().map(function (w) {
      var x = wordMap[w], b = state.box[w];
      return [w, x.p, x.m, (b.wrong ? "間違い" : "") + (b.wrong && b.check ? "+" : "") + (b.check ? "チェック" : "")];
    }));
  }
  function exportOrCopy(kind, rows, file) {
    var text = toCsv(rows);
    if (kind === "exp") {
      message = download(file, text) ? "CSVを保存しました。開けない場合は「コピー」を使ってください。" : "保存できませんでした。「コピー」を使ってください。";
      rerender();
    } else {
      copy(text, function (ok) { message = ok ? "コピーしました。メモなどに貼り付けて使えます。" : "コピーできませんでした。"; rerender(); });
    }
  }
  function rerender() { if (quiz && !quiz.done && quiz.qs) renderQuiz(); else if (screen === "box") renderBox(); else renderHome(); }

  var screen = "home";
  function go(s) { screen = s; if (s === "box") renderBox(); else renderHome(); window.scrollTo(0, 0); }

  function doImport(file) {
    var mode = document.getElementById("impmode").value;
    var fr = new FileReader();
    fr.onload = function () {
      var rows = rowsFromCsv(String(fr.result || ""));
      if (rows.length < 4) { message = "取り込めませんでした。word, pos, meaning の列があるCSVを選んでください。"; renderHome(); return; }
      var base = mode === "merge" ? words.map(function (x) { return [x.w, x.p, x.m]; }) : [];
      var idx = {};
      base.forEach(function (r, i) { idx[r[0]] = i; });
      rows.forEach(function (r) { if (idx[r[0]] !== undefined) base[idx[r[0]]] = r; else { idx[r[0]] = base.length; base.push(r); } });
      save(WKEY, base);
      words = toWords(base); indexWords();
      message = rows.length + "語を取り込みました（現在 " + words.length + "語）。";
      renderHome();
    };
    fr.readAsText(file, "utf-8");
  }

  document.addEventListener("click", function (e) {
    var t = e.target.closest("[data-act]");
    if (!t || t.disabled) return;
    var a = t.getAttribute("data-act");
    if (a !== "reset-stats") confirmReset = false;
    if (a === "start-all") startQuiz("all");
    else if (a === "start-box") startQuiz("box");
    else if (a === "open-box") { quiz = null; go("box"); }
    else if (a === "home") { quiz = null; go("home"); }
    else if (a === "again") startQuiz(quiz.mode);
    else if (a === "pick") pick(+t.getAttribute("data-i"));
    else if (a === "flag") toggleFlag();
    else if (a === "next") next();
    else if (a === "quit") { quiz = null; go("home"); }
    else if (a === "out") { var w = t.getAttribute("data-w"); delete state.box[w]; persist(); renderBox(); }
    else if (a === "exp-all") exportOrCopy("exp", allRows(), "words.csv");
    else if (a === "copy-all") exportOrCopy("copy", allRows());
    else if (a === "exp-box") exportOrCopy("exp", boxRows(), "box.csv");
    else if (a === "copy-box") exportOrCopy("copy", boxRows());
    else if (a === "reset-words") { drop(WKEY); words = toWords(WORDS_DEFAULT); indexWords(); message = "初期データ（" + words.length + "語）に戻しました。"; renderHome(); }
    else if (a === "reset-stats") {
      if (!confirmReset) { confirmReset = true; renderHome(); var d = app.querySelector("details"); if (d) d.open = true; }
      else { state.box = {}; state.stats = {}; persist(); confirmReset = false; message = "学習記録と箱を消しました。"; renderHome(); }
    }
  });
  document.addEventListener("change", function (e) {
    if (e.target.id === "nsel") { state.settings.n = +e.target.value; persist(); }
    else if (e.target.id === "roc") { state.settings.removeOnCorrect = e.target.checked; persist(); }
    else if (e.target.id === "impfile" && e.target.files[0]) doImport(e.target.files[0]);
  });
  document.addEventListener("keydown", function (e) {
    if (!quiz || quiz.done || e.metaKey || e.ctrlKey || e.altKey) return;
    var q = quiz.qs[quiz.i];
    if (q.picked === null && e.key >= "1" && e.key <= "4") { pick(+e.key - 1); e.preventDefault(); }
    else if (q.picked !== null && (e.key === "Enter" || e.key === " ")) { next(); e.preventDefault(); }
    else if (e.key === "c" || e.key === "C") { toggleFlag(); }
  });

  renderHome();
  if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol)) {
    navigator.serviceWorker.register("sw.js").catch(function () {});
  }
})();
</script>
</body>
</html>
